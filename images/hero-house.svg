<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Архітектурний ескіз каркасного будинку РАМА з великим склінням та терасою</title>
  <rect x="0" y="0" width="1600" height="1000" fill="#F3EFE7"/>
  <!-- ground -->
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#2A2721" stroke-width="1.5" opacity="0.35"/>
  <!-- tree line, minimal -->
  <g stroke="#6B7353" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M120 760 L120 620 M80 660 L160 660 M95 610 L145 610"/>
    <path d="M1480 760 L1480 640 M1445 680 L1515 680 M1458 630 L1502 630"/>
  </g>
  <!-- main volume -->
  <g stroke="#2A2721" stroke-width="2.5" fill="none">
    <polyline points="360,760 360,470 800,300 1240,470 1240,760"/>
    <line x1="360" y1="470" x2="1240" y2="470"/>
    <line x1="800" y1="300" x2="800" y2="180"/>
  </g>
  <!-- roof detail -->
  <g stroke="#B08655" stroke-width="2" fill="none">
    <polyline points="330,486 800,270 1270,486"/>
  </g>
  <!-- glazing wall -->
  <g stroke="#2A2721" stroke-width="1.5" fill="none">
    <rect x="430" y="500" width="340" height="260"/>
    <line x1="500" y1="500" x2="500" y2="760"/>
    <line x1="570" y1="500" x2="570" y2="760"/>
    <line x1="640" y1="500" x2="640" y2="760"/>
    <line x1="710" y1="500" x2="710" y2="760"/>
    <line x1="430" y1="630" x2="770" y2="630"/>
  </g>
  <!-- solid wood wall -->
  <g stroke="#2A2721" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="860" y1="500" x2="860" y2="760"/>
    <line x1="920" y1="500" x2="920" y2="760"/>
    <line x1="980" y1="500" x2="980" y2="760"/>
    <line x1="1040" y1="500" x2="1040" y2="760"/>
    <line x1="1100" y1="500" x2="1100" y2="760"/>
    <line x1="1160" y1="500" x2="1160" y2="760"/>
  </g>
  <!-- terrace -->
  <g stroke="#2A2721" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="330" y1="760" x2="330" y2="800"/>
    <line x1="1270" y1="760" x2="1270" y2="800"/>
    <line x1="330" y1="800" x2="1270" y2="800"/>
    <line x1="380" y1="800" x2="380" y2="830"/>
    <line x1="480" y1="800" x2="480" y2="830"/>
    <line x1="580" y1="800" x2="580" y2="830"/>
    <line x1="680" y1="800" x2="680" y2="830"/>
  </g>
</svg>
