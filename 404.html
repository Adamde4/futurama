<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Futurama</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ivory:#F3EFE7; --ink:#2A2721; --wood:#B08655; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
    background: var(--ivory); color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .wrap { max-width: 480px; }
  h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 16px; }
  p { margin: 0 0 28px; color: #3A3733; }
  a { display: inline-flex; padding: 14px 28px; border-radius: 999px; background: var(--ink); color: var(--ivory);
      text-decoration: none; font-weight: 600; transition: background 0.3s ease; }
  a:hover { background: var(--wood); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Цю сторінку ще не збудовано.</h1>
    <p>Схоже, посилання веде в порожнечу. Повертайтеся на головну — там усі проєкти на місці.</p>
    <a href="./">На головну</a>
  </div>
</body>
</html>
